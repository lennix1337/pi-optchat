<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace">
  <title>pi-optchat: an always-on engineering agent that remembers everything</title>
  <defs>
    <radialGradient id="bg" cx="72%" cy="45%" r="80%">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset=".55" stop-color="#0c0814"/>
      <stop offset="1" stop-color="#050309"/>
    </radialGradient>
    <radialGradient id="core" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#e9d8ff"/>
      <stop offset=".25" stop-color="#a66bff"/>
      <stop offset=".7" stop-color="#3a1670"/>
      <stop offset="1" stop-color="#12081f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b4dff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#f3eaff"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <style>
      .orbit { fill: none; stroke: #8b4dff; stroke-opacity: .22; stroke-dasharray: 2 7; }
      .spin1 { animation: spin 38s linear infinite; transform-origin: 960px 220px; }
      .spin2 { animation: spin 56s linear infinite reverse; transform-origin: 960px 220px; }
      .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: 960px 220px; }
      .node rect { fill: #140b24; stroke: #8b4dff; stroke-opacity: .7; }
      .node text { fill: #e6dbff; font-size: 13px; }
      .counter-spin1 { animation: spin 38s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
      .counter-spin2 { animation: spin 56s linear infinite; transform-box: fill-box; transform-origin: center; }
      .edge { stroke: #b48cff; stroke-width: 1.2; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
      .leaf { fill: #8b4dff; animation: blink 3s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>

  <!-- memory tree: messages summarized in pairs, again and again -->
  <g transform="translate(64 300)" stroke="#8b4dff" stroke-opacity=".5" fill="none">
    <path d="M240 0 L120 40 M240 0 L360 40 M120 40 L60 80 M120 40 L180 80 M360 40 L300 80 M360 40 L420 80
             M60 80 L30 110 M60 80 L90 110 M180 80 L150 110 M180 80 L210 110 M300 80 L270 110 M300 80 L330 110 M420 80 L390 110 M420 80 L450 110"/>
  </g>
  <g transform="translate(64 300)">
    <circle cx="240" cy="0" r="5" fill="#d9c2ff"/>
    <circle cx="120" cy="40" r="4" fill="#b48cff"/><circle cx="360" cy="40" r="4" fill="#b48cff"/>
    <g fill="#9a6bff"><circle cx="60" cy="80" r="3.5"/><circle cx="180" cy="80" r="3.5"/><circle cx="300" cy="80" r="3.5"/><circle cx="420" cy="80" r="3.5"/></g>
    <circle class="leaf" cx="30" cy="110" r="3"/><circle class="leaf" cx="90" cy="110" r="3" style="animation-delay:.4s"/>
    <circle class="leaf" cx="150" cy="110" r="3" style="animation-delay:.8s"/><circle class="leaf" cx="210" cy="110" r="3" style="animation-delay:1.2s"/>
    <circle class="leaf" cx="270" cy="110" r="3" style="animation-delay:1.6s"/><circle class="leaf" cx="330" cy="110" r="3" style="animation-delay:2s"/>
    <circle class="leaf" cx="390" cy="110" r="3" style="animation-delay:2.4s"/><circle class="leaf" cx="450" cy="110" r="3" style="animation-delay:2.8s"/>
    <text x="490" y="44" fill="#8f7bb3" font-size="12">one endless chat, summarized</text>
    <text x="490" y="62" fill="#8f7bb3" font-size="12">into a tree; zoom reads originals</text>
  </g>

  <!-- title -->
  <text x="64" y="104" font-size="64" font-weight="700" fill="url(#title)" letter-spacing="-1">pi-optchat</text>
  <text x="66" y="146" font-size="21" fill="#d8c9f5">An always-on engineering agent that</text>
  <text x="66" y="174" font-size="21" fill="#d8c9f5">remembers everything and ships on its own<tspan class="cursor" fill="#b48cff">_</tspan></text>
  <text x="66" y="222" font-size="14" fill="#9d8cc0">174k messages in one chat · 392 merged PRs · 2,085 tests · runs 24/7</text>
  <text x="66" y="246" font-size="14" fill="#9d8cc0">Slack on the phone · CI that wakes it up · a crew of Claude, Codex and Gemini workers</text>

  <!-- core and orbits -->
  <circle cx="960" cy="220" r="170" fill="url(#halo)"/>
  <circle class="orbit" cx="960" cy="220" r="118"/>
  <circle class="orbit" cx="960" cy="220" r="178"/>

  <g class="pulse">
    <polygon points="960,160 1012,190 1012,250 960,280 908,250 908,190" fill="url(#core)" stroke="#d9c2ff" stroke-opacity=".6"/>
    <polygon points="960,160 1012,190 960,220 908,190" fill="#ffffff" fill-opacity=".08"/>
  </g>
  <text x="960" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#f6efff">JARVIS</text>

  <g class="spin1">
    <line class="edge" x1="960" y1="220" x2="960" y2="102"/>
    <line class="edge" x1="960" y1="220" x2="1062" y2="279"/>
    <line class="edge" x1="960" y1="220" x2="858" y2="279"/>
    <g class="node" transform="translate(960 102)"><g class="counter-spin1"><rect x="-44" y="-14" width="88" height="28" rx="6"/><text text-anchor="middle" y="5">memory</text></g></g>
    <g class="node" transform="translate(1062 279)"><g class="counter-spin1"><rect x="-44" y="-14" width="88" height="28" rx="6"/><text text-anchor="middle" y="5">gitwatch</text></g></g>
    <g class="node" transform="translate(858 279)"><g class="counter-spin1"><rect x="-44" y="-14" width="88" height="28" rx="6"/><text text-anchor="middle" y="5">Slack</text></g></g>
  </g>
  <g class="spin2">
    <g class="node" transform="translate(1138 220)"><g class="counter-spin2"><rect x="-40" y="-14" width="80" height="28" rx="6"/><text text-anchor="middle" y="5">Codex</text></g></g>
    <g class="node" transform="translate(871 66)"><g class="counter-spin2"><rect x="-40" y="-14" width="80" height="28" rx="6"/><text text-anchor="middle" y="5">Claude</text></g></g>
    <g class="node" transform="translate(871 374)"><g class="counter-spin2"><rect x="-40" y="-14" width="80" height="28" rx="6"/><text text-anchor="middle" y="5">Gemini</text></g></g>
  </g>

  <text x="1216" y="420" text-anchor="end" font-size="11" fill="#5f5180">by lennix1337</text>
</svg>
